[project]
name = "call-me-maybe"
version = "0.1.0"
description = "Function calling in lightweight LLMs via constrained decoding"
readme = "README.md"
authors = [
    { name = "skhachat" }
]
requires-python = ">=3.10"
dependencies = [
    "llm-sdk",
    "pydantic>=2.13.4",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "llm_sdk",
]

[tool.uv.sources]
llm-sdk = { workspace = true }

[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "mypy>=2.3.1",
]

[tool.mypy]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "llm_sdk"
ignore_errors = true


